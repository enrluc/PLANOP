crons:
  - name: reminder-daily
    description: "Invia i reminder email 24h prima degli interventi ai clienti"
    cron: "0 9 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/reminders"
    method: POST
    enabled: true
  - name: gcal-sync-daily
    description: "Sincronizza gli appuntamenti da Google Calendar iCal per bloccare le date"
    cron: "0 8 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/gcal-sync"
    method: POST
    enabled: true
  - name: monthly-agenda
    description: "Il 1 del mese invia via email l'agenda Excel del mese precedente con km percorsi"
    cron: "0 7 1 * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/monthly-agenda"
    method: POST
    enabled: true
  - name: weekly-backup
    description: "Ogni domenica alle 22:00 invia via email il backup ZIP di clienti, contratti e interventi"
    cron: "0 22 * * 0"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/weekly-backup"
    method: POST
    enabled: true
